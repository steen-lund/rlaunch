name: build

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:

  # The amiga binary is built once here; the other jobs download it so every
  # package contains a host controller plus the amiga target it talks to.
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: build host
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4
    - name: test
      run: ctest --test-dir build --output-on-failure
    - name: build amiga
      run: |
        cmake -B build-amiga -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/amiga-vbcc.cmake
        cmake --build build-amiga -j 4
    - name: test amigafs on the host
      run: test/amigafs-host-test.sh
    - name: package
      run: |
        mkdir -p dist
        cp build/rl-controller build/rl-target dist/
        cp build-amiga/rl-target dist/rl-target.amiga
    - uses: actions/upload-artifact@v4
      with:
        name: rlaunch-amiga
        path: build-amiga/rl-target
    - uses: actions/upload-artifact@v4
      with:
        name: rlaunch-linux
        path: dist

  # Boots AROS m68k under Amiberry and drives a real target with the host
  # controller. This is the only job that covers the open -> read -> close path
  # a user actually walks, so it blocks: if it goes flaky, the flakiness is the
  # bug.
  AmigaE2E:
    needs: Linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: build host
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4
    - name: build amiga
      run: |
        cmake -B build-amiga -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/amiga-vbcc.cmake
        cmake --build build-amiga -j 4
    - name: end-to-end against emulated amiga
      run: test/amiga-e2e.sh build build-amiga

  macOS:
    needs: Linux
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: build host
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4
    - name: test
      run: ctest --test-dir build --output-on-failure
    - uses: actions/download-artifact@v4
      with:
        name: rlaunch-amiga
        path: amiga
    - name: package
      run: |
        mkdir -p dist
        cp build/rl-controller build/rl-target dist/
        cp amiga/rl-target dist/rl-target.amiga
    - uses: actions/upload-artifact@v4
      with:
        name: rlaunch-macos
        path: dist

  Windows:
    needs: Linux
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: build host
      run: |
        cmake -B build
        cmake --build build --config Release
    - name: test
      run: ctest --test-dir build -C Release --output-on-failure
    - uses: actions/download-artifact@v4
      with:
        name: rlaunch-amiga
        path: amiga
    - name: package
      shell: bash
      run: |
        mkdir -p dist
        cp build/Release/rl-controller.exe build/Release/rl-target.exe dist/
        cp amiga/rl-target dist/rl-target.amiga
    - uses: actions/upload-artifact@v4
      with:
        name: rlaunch-windows
        path: dist

  Release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Linux, macOS, Windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: zip packages
      run: |
        cd artifacts
        for d in rlaunch-linux rlaunch-macos rlaunch-windows; do
          zip -rj "$d-${GITHUB_REF_NAME}.zip" "$d"
        done
    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes artifacts/*.zip
